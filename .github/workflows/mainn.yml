name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: |
          code=0
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1 || code=$?
          if [ $code -ne 0 ]; then
            echo '## Build errors' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E -A4 '^e: |What went wrong' build.log | head -60 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: GlassLauncher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
